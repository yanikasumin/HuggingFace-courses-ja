<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 668" role="img" aria-label="翻訳プロセスの図">
  <style>
    .box { fill: #161d2e; stroke: #2c3a52; stroke-width: 1.2; rx: 10; }
    .t { fill: #e6ebf2; font-size: 15px; font-weight: 700; font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
    .d { fill: #9fb0c3; font-size: 11.5px; font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
    .chip { font-size: 11px; font-weight: 700; font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
    .arrow { stroke: #5b6b84; stroke-width: 1.6; fill: none; marker-end: url(#ah); }
    .loop { stroke: #ffd21e; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; marker-end: url(#ahy); }
    .loopt { fill: #ffd21e; font-size: 11px; font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5b6b84"/></marker>
    <marker id="ahy" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#ffd21e"/></marker>
  </defs>

  <!-- 1 -->
  <rect class="box" x="90" y="10" width="560" height="66" rx="10"/>
  <text class="t" x="112" y="38">1. 原典の固定</text>
  <text class="d" x="112" y="60">英語版リポジトリを特定のコミットに固定し、翻訳対象の版を確定する</text>
  <rect x="556" y="24" width="76" height="20" rx="10" fill="#1d2f4d"/><text class="chip" x="594" y="38" text-anchor="middle" fill="#7fb2f0">Muse</text>

  <line class="arrow" x1="370" y1="76" x2="370" y2="102"/>

  <!-- 2 -->
  <rect class="box" x="90" y="104" width="560" height="66" rx="10"/>
  <text class="t" x="112" y="132">2. 翻訳</text>
  <text class="d" x="112" y="154">全セクションを翻訳する。コード・数式・数値・URL は原文のまま保持する</text>
  <rect x="556" y="118" width="76" height="20" rx="10" fill="#1d2f4d"/><text class="chip" x="594" y="132" text-anchor="middle" fill="#7fb2f0">Muse</text>

  <line class="arrow" x1="370" y1="170" x2="370" y2="196"/>

  <!-- 3 -->
  <rect class="box" x="90" y="198" width="560" height="66" rx="10"/>
  <text class="t" x="112" y="226">3. レビュー</text>
  <text class="d" x="112" y="248">単元ごとに審査する。基準は自然さ、意味の誤り、用語と表記、日本語向けの組版</text>
  <rect x="544" y="212" width="88" height="20" rx="10" fill="#173a2e"/><text class="chip" x="588" y="226" text-anchor="middle" fill="#7fd1ae">ChatGPT</text>

  <line class="arrow" x1="370" y1="264" x2="370" y2="290"/>

  <!-- 4 -->
  <rect class="box" x="90" y="292" width="560" height="66" rx="10"/>
  <text class="t" x="112" y="320">4. 照合と修正</text>
  <text class="d" x="112" y="342">指摘を実ファイルと原典で1件ずつ照合してから直す。裏付けのない指摘は適用しない</text>
  <rect x="556" y="306" width="76" height="20" rx="10" fill="#1d2f4d"/><text class="chip" x="594" y="320" text-anchor="middle" fill="#7fb2f0">Muse</text>

  <line class="arrow" x1="370" y1="358" x2="370" y2="384"/>

  <!-- 5 -->
  <rect class="box" x="90" y="386" width="560" height="66" rx="10"/>
  <text class="t" x="112" y="414">5. 機械検証</text>
  <text class="d" x="112" y="436">コード・リンク・アンカー・画像が原典と一致しているかを自動で照合する</text>
  <rect x="556" y="400" width="76" height="20" rx="10" fill="#1d2f4d"/><text class="chip" x="594" y="414" text-anchor="middle" fill="#7fb2f0">Muse</text>

  <line class="arrow" x1="370" y1="452" x2="370" y2="478"/>

  <!-- 6 -->
  <rect class="box" x="90" y="480" width="560" height="66" rx="10"/>
  <text class="t" x="112" y="508">6. 再チェック</text>
  <text class="d" x="112" y="530">修正後の文を再び審査し、合格かどうかを判定する</text>
  <rect x="544" y="494" width="88" height="20" rx="10" fill="#173a2e"/><text class="chip" x="588" y="508" text-anchor="middle" fill="#7fd1ae">ChatGPT</text>

  <!-- loop: 6 -> 4 -->
  <path class="loop" d="M650,513 L688,513 L688,325 L658,325"/>
  <text class="loopt" x="694" y="404">不合格なら</text>
  <text class="loopt" x="694" y="420">修正へ戻る</text>

  <line class="arrow" x1="370" y1="546" x2="370" y2="572"/>

  <!-- 7 -->
  <rect class="box" x="90" y="574" width="560" height="66" rx="10"/>
  <text class="t" x="112" y="602">7. 公開</text>
  <text class="d" x="112" y="624">合格した文をサイトに反映して公開する。文体や用語の最終判断は翻訳者が行う</text>
  <rect x="544" y="588" width="88" height="20" rx="10" fill="#4d3d05"/><text class="chip" x="588" y="602" text-anchor="middle" fill="#ffd21e">霞ヶ関京</text>
</svg>
